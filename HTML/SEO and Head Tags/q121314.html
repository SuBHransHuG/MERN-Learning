<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><form action=""></form></title>
</head>
<body>
    <form action="">
        <label for="name">Name:</label><br>
        <input type="text" placeholder="name" required><br><br>
        <label for="password">Password:</label><br>
        <input type="password" name="password" id="password" placeholder="password" required><br><br>
        <label for="email">Email:</label><br>
        <input type="email" name="email" id="email" placeholder="email" required><br><br>
        <label for="address">address:</label><br>
        <textarea name="address" id="address" placeholder="address"></textarea><br><br>
        <label for="courses">courses</label>
        <input type="checkbox" name="cpp" id="cpp">Cpp
        <input type="checkbox" name="java" id="java">java <br> <br>
        <label for="gender">gender:</label><br>
        <input type="radio" name="gender" id="Male">Male
        <input type="radio" name="gender" id="Female">Female <br><br>
        <button onclick="Submit">SUBMIT</button>
    
    </form>
</body>
</html>
