<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <style>
        table{
            border: 2px solid black;
            padding: 15px;
            border-collapse: collapse;
        }
        th{
            border: 2px solid black;
            padding: 15px;}
        td{
            border: 2px solid black;
            padding: 15px;}
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>name</th>
                <th>course</th>
                <th>phone</th>
            </tr>
            <tr>
                <td>Subham</td>
                <td>MERN</td>
                <td>1234567890</td>
            </tr>
            <tr>
                <td>Kuldeep</td>
                <td>Cpp</td>
                <td>0987654321</td>
            </tr>
            <tr>
                <td>Mihir</td>
                <td>Java</td>
                <td>5432789054</td>
            </tr>
        </thead>
    </table>
</body>
</html>
